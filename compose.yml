# Production: the app plus a Litestream sidecar that backs the database up to S3.
# A reverse proxy on the external "web" network reaches the container `teamsheet-11` on
# port 3000. Settings live in .env.production next to this file (never in git, never baked
# into the image); see .env.example.
name: teamsheet-11
services:
  web:
    build:
      context: .
    image: teamsheet-11:latest
    container_name: teamsheet-11
    restart: unless-stopped
    init: true
    env_file: .env.production
    volumes:
      # The SQLite database. Owned by uid 1000 (the image's `node` user).
      - ./data:/data
    networks:
      - default
      - web

  # Streams every database change to the ts11 bucket, so the box can be lost
  # without losing accounts. Restore: see deploy/README.md.
  litestream:
    image: litestream/litestream:0.5.17
    restart: unless-stopped
    command: ["replicate", "-config", "/etc/litestream.yml"]
    env_file: .env.production
    volumes:
      - ./data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - web

networks:
  web:
    external: true
