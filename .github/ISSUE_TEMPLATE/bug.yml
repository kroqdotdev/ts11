name: Something's wrong
description: A graphic looks broken, a button doesn't work, something got lost.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or exported PNG
      description: Drag it in here. For a graphic, say which one, which style and which size.
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari / Windows laptop, Chrome
  - type: dropdown
    id: account
    attributes:
      label: Were you signed in?
      options:
        - "No"
        - "Yes"
        - Not sure
